name: Deploy LaViora V1, V2 and V3 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare all versions (keep V1 and V2 at their original URLs)
        run: |
          mkdir -p _site/v2 _site/v3
          cp -a LaViora_Meta広告v1/. _site/
          cp -a LaViora_Meta広告v2/. _site/v2/
          cp -a LaViora_Meta広告v3/. _site/v3/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
